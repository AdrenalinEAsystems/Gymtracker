name: Automatinis versijavimas ir Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.html'

permissions:
  contents: write

jobs:
  update-version-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Atsisiųsti repozitorijos failus
        uses: actions/checkout@v4

      - name: Ištraukti versiją ir pakeitimus iš index.html į version.json
        id: extract
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const verMatch = html.match(/const\s+APP_VERSION\s*=\s*["'\'']([^"'\'']+)["'\'']/);
            const notesMatch = html.match(/\/\/\s*RELEASE_NOTES:\s*(.+)/);

            const version = verMatch ? verMatch[1].trim() : new Date().toISOString().slice(0,16).replace("T", "_");
            const notes = notesMatch ? notesMatch[1].trim() : "Nauji patobulinimai ir klaidų taisymai.";

            if (verMatch) {
              const data = { version, notes };
              fs.writeFileSync("version.json", JSON.stringify(data, null, 2) + "\n");
              console.log("Sugeneruotas version.json:", data);
            } else {
              console.log("APP_VERSION nerastas – version.json nekeičiamas");
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nnotes=${notes}\n`);
          '

      - name: Išsaugoti version.json
        env:
          # per env, o ne tiesiogiai į shell tekstą – jokio kodo įterpimo per versijos eilutę
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update version.json to v${VERSION} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "version.json nepasikeitė"
          fi

      - name: Sukurti arba atnaujinti GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract.outputs.version }}
          name: Versija ${{ steps.extract.outputs.version }}
          body: ${{ steps.extract.outputs.notes }}
          files: index.html
